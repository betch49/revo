[package]
name = "revo"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8", features = ["multipart", "ws"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
rand = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
