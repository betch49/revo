# LLM router for the mini PC: one always-on endpoint (port 4000) for all apps.
# 4090 (Ollama on the main PC) when it's up, Infomaniak AI when it isn't.

services:
  # Fail-fast proxy to Ollama, see nginx/ollama.conf.template
  ollama-gw:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      OLLAMA_UPSTREAM: ${OLLAMA_UPSTREAM:?set OLLAMA_UPSTREAM in .env}
    volumes:
      - ./nginx/ollama.conf.template:/etc/nginx/templates/default.conf.template:ro

  litellm:
    image: ghcr.io/berriai/litellm:v1.106.0
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: .env
    environment:
      OLLAMA_API_BASE: http://ollama-gw:11434/v1
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    depends_on:
      - ollama-gw
