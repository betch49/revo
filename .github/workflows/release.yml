# Builds a static Linux binary (runs on any x86_64 Linux server, no Rust needed there).
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.0 to also
# attach the binary to a GitHub Release.
name: Release binary

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/revo dist/revo
          cd dist && tar czf revo-x86_64-linux.tar.gz revo && sha256sum revo-x86_64-linux.tar.gz > revo-x86_64-linux.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: revo-x86_64-linux
          path: dist/revo-x86_64-linux.tar.gz*
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/revo-x86_64-linux.tar.gz*
