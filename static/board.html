<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Board · Betch</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/board.css">
  <script src="/static/common.js" defer></script>
  <script src="/static/board-core.js" defer></script>
  <script src="/static/board-render.js" defer></script>
  <script src="/static/board-tools.js" defer></script>
  <script src="/static/board-ui.js" defer></script>
  <script src="/static/board-main.js" defer></script>
</head>
<body class="board-page">
  <div id="app" hidden>
    <main id="viewport" aria-label="Board canvas">
      <div id="world">
        <div id="layer"></div>
        <div id="sel-layer"></div>
        <div id="draft-layer"></div>
        <div id="pin-layer"></div>
      </div>
    </main>
    <div id="cursor-layer" aria-hidden="true"></div>

    <header class="bar bar-left ui">
      <a class="brand" href="https://betch.ch" target="_blank" rel="noopener"><span class="dot"></span>betch</a>
      <span class="bar-sep"></span>
      <button type="button" class="title-btn" id="board-title"></button>
      <a class="bar-link" id="home-link" href="/admin" hidden>All boards</a>
    </header>

    <header class="bar bar-right ui">
      <div class="peers" id="peers"></div>
      <span class="role-badge" id="role-badge" hidden></span>
      <button type="button" class="icon-btn" id="comments-btn" title="Comments" aria-label="Comments"><span class="count" id="comment-count" hidden></span></button>
      <button type="button" class="primary" id="share-btn" hidden>Share</button>
    </header>

    <nav class="toolbar ui" id="toolbar" aria-label="Tools"></nav>

    <div class="zoombar ui">
      <button type="button" class="icon-btn" id="help-btn" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts"></button>
      <span class="bar-sep"></span>
      <button type="button" class="icon-btn" id="zoom-out" title="Zoom out (Ctrl −)" aria-label="Zoom out"></button>
      <button type="button" class="zoom-label" id="zoom-label" title="Zoom to 100% (Ctrl 0)">100%</button>
      <button type="button" class="icon-btn" id="zoom-in" title="Zoom in (Ctrl +)" aria-label="Zoom in"></button>
      <button type="button" class="icon-btn" id="zoom-fit" title="Fit board (Shift 1)" aria-label="Fit board"></button>
    </div>

    <div class="ctx-toolbar ui" id="ctx" role="toolbar" aria-label="Selection" hidden></div>
    <aside class="comments-panel ui" id="comments-panel" aria-label="Comments" hidden></aside>
    <div class="conn-banner" id="conn-banner" role="status" hidden>Reconnecting…</div>
    <input type="file" id="image-input" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
  </div>

  <div class="center-page" id="gate" hidden>
    <form class="card" id="gate-form">
      <span class="brand"><span class="dot"></span>betch</span>
      <h1>This board is protected</h1>
      <p>Enter the passcode you received with the link.</p>
      <div class="field">
        <label for="gate-passcode">Passcode</label>
        <input type="password" id="gate-passcode" autocomplete="current-password" required>
        <div class="error-text" id="gate-error"></div>
      </div>
      <button type="submit" class="primary">Open board</button>
    </form>
  </div>

  <div class="center-page" id="missing" hidden>
    <div class="card">
      <span class="brand"><span class="dot"></span>betch</span>
      <h1>Board not found</h1>
      <p>This link doesn't lead to a board you can open. Check the link, or ask for a new one.</p>
      <a class="btn" href="https://betch.ch">Go to betch.ch</a>
    </div>
  </div>
</body>
</html>
